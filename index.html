<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- History Button -->
    <button id="historyBtn" class="history-btn">

        <svg width="28" height="28" viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

            <path d="M3 3v5h5"></path>
            <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
            <path d="M12 7v5l4 2"></path>

        </svg>

    </button>

    <div class="calculator">

        <!-- History Panel -->

        <div class="history-panel" id="historyPanel">

            <div class="history-header">

                <h2>History</h2>

                <button id="closeHistory">✕</button>

            </div>

            <p class="today">Today</p>

            <div id="historyList" class="history-list">

                <!-- History Here -->

            </div>

            <button id="clearHistory" class="clear-history">

                🗑 Clear History

            </button>

        </div>

        <!-- Display -->

        <div class="display">

            <div id="expression" class="expression"></div>

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button class="function" onclick="clearDisplay()">AC</button>

            <button class="function" onclick="deleteLast()">⌫</button>

            <button class="function" onclick="plusMinus()">±</button>

            <button class="operator" onclick="append('/')">÷</button>


            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">×</button>


            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">−</button>


            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>


            <button onclick="append('%')">%</button>
            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
